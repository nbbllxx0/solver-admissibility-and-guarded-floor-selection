# Platform A CuPy (cupy-cuda12x 13.6.0, CUDA 12.x). The paper's reference runs used
# this CuPy with Python 3.9.23 on an NVIDIA RTX 4090 (SM 8.9); this file pins a
# newer Python and numpy.
#
# On Blackwell GPUs (SM 12.0, e.g. RTX 5090) the cupy-cuda12x wheel can raise
# CUDA_ERROR_NO_BINARY_FOR_GPU. Use environment-blackwell.yml in that case, and see
# README section 3 for the two required runtime adjustments.
name: paper5-solver-admissibility
channels:
  - conda-forge
dependencies:
  - python=3.10.18
  - pip=24.3
  - pip:
      - cupy-cuda12x==13.6.0
      - numpy==2.2.6
      - scipy==1.15.3
      - matplotlib==3.10.7
      - pandas==2.3.3
      - pyvista==0.46.3
      - scikit-image==0.25.2
      - pyamg==5.3.0
      - pynvml==13.0.1
      - nvidia-ml-py==13.595.45
